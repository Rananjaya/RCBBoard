# SPDX-License-Identifier: GPL-3.0-only
# Stage 2 - QA: started by hand with the exact commit SHA to test. The commit must be on
# develop and must have a successful Development run (which already ran the CI checks on
# exactly this commit). Builds the Debug APK (:app:assembleDebug,
# com.rananjaya.rcbboard.debug) from exactly that commit for testing on the phone.
# Signed with the persistent RCBBoard debug key. No production secrets, no tags, no releases.
# See docs/ci-cd.md.
name: QA
# The release workflow finds the QA run for a commit by this name: keep it exactly so.
run-name: QA ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA on develop (copy it from the Development run summary)"
        required: true
        type: string

permissions: {}

concurrency:
  group: qa-${{ inputs.commit }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108"
  BUILD_TOOLS_VERSION: "36.0.0"
  APP_ID: com.rananjaya.rcbboard.debug

jobs:
  gate:
    name: Verify commit
    if: github.repository == 'Rananjaya/RCBBoard' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # find the Development run for the commit
    outputs:
      commit: ${{ steps.gate.outputs.sha }}
      development_run: ${{ steps.gate.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit is on develop and passed Development
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: >-
          python3 .github/scripts/stage_gate.py qa --sha "$COMMIT_INPUT"
          --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

  build:
    name: QA APK
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.gate.outputs.commit }}
      DEVELOPMENT_RUN: ${{ needs.gate.outputs.development_run }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Confirm the checked-out commit
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $COMMIT"; exit 1; }

      # Every Development and QA APK is signed with the same persistent RCBBoard debug key
      # (repository secrets DEBUG_*, never the production key), so a new build installs as an
      # update over the previous one. Without it the run stops. See docs/ci-cd.md.
      - name: Check debug signing secrets
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DEBUG_KEY_PASSWORD }}
          CERT: ${{ vars.DEBUG_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing DEBUG_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing DEBUG_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing DEBUG_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing DEBUG_KEY_PASSWORD"
          [ -n "$CERT" ] || missing="$missing DEBUG_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then
            echo "::error title=Debug signing not configured::Missing:$missing. Add the RCBBoard debug key as repository secrets and its certificate SHA-256 as a repository variable (docs/ci-cd.md, 'Debug signing key'). Nothing was built."
            exit 1
          fi

      # The version that a production release of this commit would get. versionCode = minutes
      # since 1970, so the QA build installs as an update over an earlier Development build.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          short="${COMMIT:0:7}"
          if python3 .github/scripts/next_version.py --head "$COMMIT" --github-output "$RUNNER_TEMP/version.txt" > /dev/null; then
            base=$(grep '^version=' "$RUNNER_TEMP/version.txt" | cut -d= -f2)
          else
            base="0.0.0"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version_name=${base}-qa.${RUN_NUMBER}+${short}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"
          echo "file_name=RCBBoard-qa-${base}-qa.${RUN_NUMBER}-${COMMIT}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: >-
          ./gradlew :app:assembleDebug
          -PrcbboardVersionCode="$VERSION_CODE" -PrcbboardVersionName="$VERSION_NAME"

      - name: Decode debug keystore
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/rcbboard-debug.keystore" \
            || { echo "::error title=Debug keystore::DEBUG_KEYSTORE_BASE64 is not valid base64"; exit 1; }

      # Re-signs the Gradle debug APK with the RCBBoard debug key and verifies it: v1/v2
      # signatures, exactly one signer with the DEBUG_CERT_SHA256 certificate, app ID, version,
      # minSdk and all four ABIs (same script as production, with the debug key and package).
      - name: Sign and verify the APK
        id: apk
        env:
          RCB_KEYSTORE: ${{ runner.temp }}/rcbboard-debug.keystore
          RCB_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          RCB_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          RCB_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          CERT: ${{ vars.DEBUG_CERT_SHA256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          FILE_NAME: ${{ steps.version.outputs.file_name }}
        run: |
          set -euo pipefail
          apks=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk')
          [ "$(printf '%s\n' "$apks" | grep -c .)" = 1 ] || { echo "::error::expected exactly one debug APK, found: $apks"; exit 1; }
          python3 .github/scripts/sign_release.py --apk "$apks" --out-dir "$RUNNER_TEMP/apk" \
            --name "${FILE_NAME%.apk}" --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --expected-cert-sha256 "$CERT" --package "$APP_ID" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --min-sdk 21
          echo "path=$RUNNER_TEMP/apk/$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Remove debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rcbboard-debug.keystore"

      # archive: false uploads the APK itself, so it downloads as an .apk instead of a .zip
      - name: Upload QA APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          FILE_NAME: ${{ steps.version.outputs.file_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          CERT: ${{ vars.DEBUG_CERT_SHA256 }}
        run: |
          {
            echo "## QA APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Commit** | \`$COMMIT\` |"
            echo "| **Development run** | $DEVELOPMENT_RUN |"
            echo "| **Version** | $VERSION_NAME (versionCode $VERSION_CODE); a release of this commit would be $BASE_VERSION |"
            echo "| **App** | RCBBoard debug (\`$APP_ID\`): replaces the Development app |"
            echo "| **APK** | [\`$FILE_NAME\`]($ARTIFACT_URL) (kept 14 days) |"
            echo "| **Signing** | RCBBoard debug key, certificate SHA-256 \`$CERT\` |"
            echo
            echo "**After testing on your phone:** Actions > Release > Run workflow on \`develop\` with commit:"
            echo
            echo "\`\`\`"
            echo "$COMMIT"
            echo "\`\`\`"
            echo
            echo "\`dry_run\` is ticked by default (nothing is published). Untick it only to publish the production release."
          } >> "$GITHUB_STEP_SUMMARY"
