# SPDX-License-Identifier: GPL-3.0-only
# Stage 3 - Production: started by hand only (never by a merge), with the exact commit SHA
# that passed QA. The commit must be on develop, its newest QA run (a manual run of qa.yml on
# develop) must have succeeded and really built that commit, and it must not be older than the
# latest release. Builds, signs and publishes exactly that commit as a universal APK, after
# approval in the 'release' environment. Only runs in Rananjaya/RCBBoard on develop. Never
# pushes commits, never force-pushes, never touches main or the HeliBoard upstream repository.
# See docs/ci-cd.md.
#
# dry_run is ticked by default: a run only publishes when dry_run is explicitly unticked.
# A dry run has the same gates, approval, build, production signing and verification, but no
# tag, no GitHub Release (not even a draft) and no APK upload; only SHA256SUMS.txt and the
# release notes are kept as a workflow artifact. Also builds when there are no app changes (as
# the next patch version), so the whole pipeline can be tested without publishing anything.
name: Release
run-name: ${{ inputs.dry_run && 'Release dry run' || 'Release' }} ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA that passed QA (copy it from the QA run summary)"
        required: true
        type: string
      bump:
        description: "Version bump (auto = from Conventional Commits since the last release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      # Ticked by default, so starting the workflow never publishes by accident. Untick it
      # only to publish a real release.
      dry_run:
        description: "Dry run: build, sign and verify, but do not tag or publish anything. Untick ONLY to publish a production release."
        type: boolean
        default: true

permissions: {}

# One release run at a time; a queued run waits instead of cancelling a running one.
concurrency:
  group: release-develop
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108"
  BUILD_TOOLS_VERSION: "36.0.0"
  APP_PACKAGE: com.ranger.myheliboard
  MIN_SDK: "21"
  # SHA-256 of the existing RCBBoard release signing certificate (also in README.md).
  EXPECTED_CERT_SHA256: 0b01373116d4a7b57646c4c7e2ffc28af91870bdbeabb4b8c05c00f313e2291b

jobs:
  version:
    name: Determine version
    if: github.repository == 'Rananjaya/RCBBoard' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # find the QA run for the commit
    outputs:
      commit: ${{ steps.gate.outputs.sha }}
      qa_run: ${{ steps.gate.outputs.run_url }}
      release: ${{ steps.publish.outputs.release }}
      # the dry-run version is only set when a dry run has no app changes to release
      version: ${{ steps.dryrun.outputs.version || steps.next.outputs.version }}
      version_code: ${{ steps.dryrun.outputs.version_code || steps.next.outputs.version_code }}
      tag: ${{ steps.dryrun.outputs.tag || steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The exact commit that is released: on develop, with a successful QA run for it.
      - name: Commit is on develop and passed QA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: >-
          python3 .github/scripts/stage_gate.py release --sha "$COMMIT_INPUT"
          --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

      # Versions exactly that commit (not the tip of develop). Also stops if the commit is older
      # than the latest release, or with recovery steps if the newest rcbboard-v* tag has no
      # published release (an earlier run failed after creating its tag); see docs/ci-cd.md.
      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.gate.outputs.sha }}
        run: >-
          python3 .github/scripts/next_version.py --head "$COMMIT" --bump "$BUMP"
          --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

      # Dry run without app changes: build the next patch version anyway, so the build and
      # signing can be tested. Only used for the dry run; never tagged or published.
      - name: Dry-run version
        id: dryrun
        if: inputs.dry_run && steps.next.outputs.release != 'true'
        env:
          COMMIT: ${{ steps.gate.outputs.sha }}
        run: >-
          python3 .github/scripts/next_version.py --head "$COMMIT" --bump patch
          --github-output "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE: ${{ steps.next.outputs.release }}
          STATUS: ${{ steps.next.outputs.status }}
          TAG: ${{ steps.dryrun.outputs.tag || steps.next.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: build, sign and verify $TAG without tagging or publishing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" != "false" ]; then
            # publishing needs an explicit dry_run=false; anything else is refused
            echo "::error title=Release::dry_run is '$DRY_RUN', not true or false. Nothing is published."
            exit 1
          elif [ "$RELEASE" != "true" ]; then
            echo "No app changes since the last release (only docs, CI or tests): nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists for this commit: nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            [ "$STATUS" = "existing-tag" ] && echo "Tag $TAG exists without a release: publishing it again."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: "${{ inputs.dry_run && 'Dry run: build and sign' || 'Build, sign and publish' }} ${{ needs.version.outputs.tag }}"
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # signing secrets and required reviewer approval, also for dry runs
    environment: release
    permissions:
      contents: write # create the tag and the GitHub Release (both skipped in a dry run)
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      COMMIT: ${{ needs.version.outputs.commit }}
      QA_RUN: ${{ needs.version.outputs.qa_run }}
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Confirm the checked-out commit
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $COMMIT"; exit 1; }

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Not configured:$missing. Add them to the 'release' environment (Settings > Environments > release). Nothing was built or published, because RCBBoard never publishes unsigned releases."
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      # No cache for release builds: they are built from a clean state.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build universal release APK ${{ env.VERSION }} (${{ env.VERSION_CODE }})
        run: >-
          ./gradlew --no-daemon :app:assembleRelease
          -PrcbboardVersionCode="$VERSION_CODE" -PrcbboardVersionName="$VERSION"

      - name: Locate the unsigned APK
        id: outputs
        run: |
          set -euo pipefail
          apks=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          [ "$(printf '%s\n' "$apks" | grep -c .)" = 1 ] || { echo "::error::expected exactly one release APK, found: $apks"; exit 1; }
          echo "apk=$apks" >> "$GITHUB_OUTPUT"
          ls -l "$apks"

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/rcbboard-release.keystore" \
            || { echo "::error title=Keystore::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }

      - name: Sign and verify APK
        env:
          RCB_KEYSTORE: ${{ runner.temp }}/rcbboard-release.keystore
          RCB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RCB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RCB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UNSIGNED_APK: ${{ steps.outputs.outputs.apk }}
        run: >-
          python3 .github/scripts/sign_release.py
          --apk "$UNSIGNED_APK"
          --out-dir "$RUNNER_TEMP/dist"
          --name "RCBBoard-$VERSION"
          --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          --expected-cert-sha256 "$EXPECTED_CERT_SHA256"
          --package "$APP_PACKAGE"
          --version-code "$VERSION_CODE"
          --version-name "$VERSION"
          --min-sdk "$MIN_SDK"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rcbboard-release.keystore"

      - name: Write release notes
        run: |
          set -euo pipefail
          short_sha="${COMMIT:0:10}"
          build_date="$(date -u '+%Y-%m-%d %H:%M UTC')"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          | | |
          | --- | --- |
          | **Version** | $VERSION (versionCode $VERSION_CODE) |
          | **Commit** | [\`$short_sha\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT) on \`develop\` |
          | **QA** | [QA run]($QA_RUN) for this commit |
          | **Build date** | $build_date |
          | **APK** | \`RCBBoard-$VERSION.apk\` (universal: arm64-v8a, armeabi-v7a, x86, x86_64) |

          ### Install
          1. Download \`RCBBoard-$VERSION.apk\` on your Android device (Android 5.0 or newer).
          2. Open it and allow installing apps from that source if Android asks. It installs as an update over an existing RCBBoard installation, keeping your settings and learned words.
          3. Enable **RCBBoard** in *Settings → System → Keyboard → On-screen keyboard* and select it.

          ### Verify
          The APK is signed with the RCBBoard release certificate, SHA-256:
          \`$EXPECTED_CERT_SHA256\`

          Check with \`apksigner verify --print-certs RCBBoard-$VERSION.apk\`. The file checksum is in \`SHA256SUMS.txt\`.
          EOF
          if [ "$DRY_RUN" = "true" ]; then
            { echo "> **Dry run:** built, signed and verified for testing only. Not tagged, not published; the APK was not kept."
              echo
              cat "$RUNNER_TEMP/release-notes.md"; } > "$RUNNER_TEMP/release-notes.tmp"
            mv "$RUNNER_TEMP/release-notes.tmp" "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      # Dry run only: keep the checksum and the notes, never the production-signed APK.
      - name: Upload dry-run results (checksum and release notes, no APK)
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ env.VERSION }}-run${{ github.run_number }}
          path: |
            ${{ runner.temp }}/dist/SHA256SUMS.txt
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run summary
        if: inputs.dry_run
        run: |
          {
            echo "## Release dry run: nothing was published"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Commit** | \`$COMMIT\` |"
            echo "| **QA run** | $QA_RUN |"
            echo "| **Version built** | $VERSION (versionCode $VERSION_CODE) |"
            echo "| **Signing** | production key, certificate \`$EXPECTED_CERT_SHA256\` verified |"
            echo "| **APK SHA-256** | \`$(cut -d' ' -f1 "$RUNNER_TEMP/dist/SHA256SUMS.txt")\` |"
            echo "| **Tag / GitHub Release** | not created |"
            echo "| **Artifact** | SHA256SUMS.txt and release-notes.md only (the APK is not uploaded) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag ${{ env.TAG }}
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # second guard next to the step condition: only an explicit dry_run=false creates a tag
          [ "$DRY_RUN" = "false" ] || { echo "::error title=Dry run::dry_run is '$DRY_RUN': no tag is created."; exit 1; }
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
            type=$(jq -r .object.type <<< "$existing"); sha=$(jq -r .object.sha <<< "$existing")
            [ "$type" = tag ] && sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            if [ "$sha" != "$COMMIT" ]; then
              echo "::error title=Tag exists::$TAG already points to $sha, not $COMMIT. Not overwriting it."
              exit 1
            fi
            echo "Tag $TAG already points to this commit."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
            echo "Created tag $TAG at $COMMIT."
          fi

      # Only marked as the latest release if no newer rcbboard-v* release is published, so
      # re-running an older failed release never takes "latest" away from a newer one.
      - name: Create GitHub Release ${{ env.TAG }}
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # second guard next to the step condition: only an explicit dry_run=false publishes
          [ "$DRY_RUN" = "false" ] || { echo "::error title=Dry run::dry_run is '$DRY_RUN': nothing is published."; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error title=Duplicate release::A GitHub Release for $TAG already exists."
            exit 1
          fi
          if ! latest=$(python3 .github/scripts/next_version.py --is-latest "$VERSION" --repo "$GITHUB_REPOSITORY"); then
            echo "$latest"; exit 1
          fi
          case "$latest" in true|false) ;; *) echo "::error::could not decide whether $VERSION is the latest release"; exit 1 ;; esac
          echo "Mark as latest release: $latest"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$latest" \
            --title "RCBBoard $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/dist/RCBBoard-$VERSION.apk" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt"
